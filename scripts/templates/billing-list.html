<template v-if="billingView==='accounts'">
  <div v-show="!detailRoom" class="billing-search"><label class="billing-search-field"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="warm-ab-icons.svg#search"/></svg><input v-model="accountSearch" placeholder="搜尋房號或房客姓名" aria-label="搜尋帳務房間" :disabled="controlsLocked"></label><label>核對狀態<select v-model="accountFilter" aria-label="收款狀態篩選" :disabled="controlsLocked"><option value="all">全部</option><option value="pending">待核對</option><option value="verified">已核實</option><option value="unpaid">未收房間</option><option value="overpaid">溢收房間</option></select></label></div>
  <section v-show="!detailRoom" class="billing-metrics" aria-label="每月對帳摘要"><article>本期應收<strong>{{billingTotals.unknown?'待補':'NT$ '+numberFormat.format(billingTotals.due)}}</strong></article><article>已核實<strong>NT$ {{numberFormat.format(billingTotals.verified)}}</strong></article><article>未核實<strong>{{billingTotals.unknown?'部分金額待補':'NT$ '+numberFormat.format(billingTotals.pending)}}</strong></article></section>
<section v-if="detailRoom" class="account-detail-page"><button @click="detailRoom=''" :disabled="controlsLocked">‹ 返回每月帳務</button><div class="account-detail-split"><aside class="account-room-list"><h2>房間清單</h2><button v-for="a in accounts" :key="a.room" @click="detailRoom=a.room" :aria-pressed="detailRoom===a.room" :disabled="controlsLocked"><strong>{{a.room}}</strong><span>{{a.vacant?'空房':a.name||'姓名待補'}}<small>{{amountText(a.netDue??a.totalDue)}}</small></span><span>›</span></button></aside><article v-if="detailAccount" class="account-detail-main"><h2>{{detailAccount.room}} 房・{{detailAccount.name||'空房'}}</h2><section class="billing-metrics"><article>房租<strong>{{amountText(detailAccount.rent)}}</strong></article><article>電費<strong>{{amountText(detailAccount.electricityFee)}}</strong></article><article>應收總額<strong>{{amountText(detailAccount.netDue??detailAccount.totalDue)}}</strong></article></section><div class="account-detail-pair"><p v-if="detailAccount.receiptDeposit>0">押金 <strong>{{amountText(detailAccount.receiptDeposit)}}</strong></p><p>實收狀態 <strong>{{receiptStatus(detailAccount)}}</strong></p></div><dl class="account-records"><div><dt>應繳日期</dt><dd>{{displayCell(detailAccount,{key:'dueDate'})}}</dd></div><div><dt>前期短收</dt><dd>{{amountText(detailAccount.arrears)}}</dd></div><div><dt>溢收抵扣</dt><dd>{{amountText(detailAccount.creditApplied)}}</dd></div><div><dt>轉帳日期</dt><dd>{{detailAccount.transferDate||'—'}}</dd></div><div><dt>轉帳後五碼</dt><dd>{{detailAccount.transferLastFive||'—'}}</dd></div><div><dt>實際收款</dt><dd>{{amountText(detailAccount.receiptTotal)}}</dd></div><div><dt>備註</dt><dd>{{detailAccount.notes||'—'}}</dd></div></dl><p v-if="detailAccount.creditWarning" class="notice">{{detailAccount.creditWarning}}</p><div class="settings-actions"><button @click="openReconciliation(detailAccount)" :disabled="controlsLocked">查看匯款截圖</button><a v-if="month%2===1&&detailAccount.meter?.billingApplicable!==false" class="rental-button" :href="noticeUrl(detailAccount)" target="_blank" rel="noopener noreferrer">預覽通知</a><button class="primary" @click="openReconciliation(detailAccount)" :disabled="controlsLocked">收款核對</button></div></article><p v-else class="empty">本月沒有此房間帳務，請選擇其他月份或房間。</p></div></section>  <div v-if="accounts.length&&!detailRoom" class="table-wrap"><table class="account-list" aria-label="每月帳務資料"><thead><tr><th>房間</th><th>房客</th><th>本期應收</th><th>核對狀態</th><th>操作</th></tr></thead><tbody :data-room="account.room" v-for="account in displayAccounts" :key="revision+':'+account.room" :class="{'unpaid-room':account.unpaid>0}"><tr class="account-data-row"><th scope="row"><button class="expand-account" @click="toggleAccount(account.room)" :aria-expanded="expandedAccounts.has(account.room)" :aria-label="'展開 '+account.room+' 房明細'"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="warm-ab-icons.svg#chevron"/></svg></button>{{account.room}}</th><td class="account-name"><strong>{{account.vacant?'空房':account.name||'姓名待補'}}</strong><span v-if="account.historySettlement==='not_applicable'">本期無應收</span></td><td class="account-money">{{account.historySettlement==='not_applicable'?'無應收':amountText(account.netDue??account.totalDue)}}</td><td class="reconciliation-status-cell"><span class="receipt-status">{{receiptStatus(account)}}</span></td><td class="reconciliation-action-cell"><button :class="{primary:!account.isReceived&&account.historySettlement!=='not_applicable'}" @click="openReconciliation(account)" :disabled="controlsLocked" :aria-label="account.room+' 房實際對帳'">實際對帳</button></td></tr><tr v-show="expandedAccounts.has(account.room)" class="account-formula-row"><td colspan="5"><div class="account-breakdown" :class="{'has-deposit':account.receiptDeposit>0}"><section class="account-fees"><h3>本期費用明細</h3><dl><div><dt>租金</dt><dd>{{amountText(account.rent)}}</dd></div><div><dt>電費</dt><dd>{{amountText(account.electricityFee)}}</dd></div><div v-if="account.arrears"><dt>前期短收</dt><dd>{{amountText(account.arrears)}}</dd></div><div v-if="account.creditApplied"><dt>溢收抵扣</dt><dd>{{amountText(account.creditApplied)}}</dd></div><div class="account-fees-total"><dt>本期應收合計</dt><dd>{{amountText(account.netDue??account.totalDue)}}</dd></div></dl></section><div v-if="account.receiptDeposit>0" class="account-deposit"><strong>押金</strong><p>{{amountText(account.receiptDeposit)}}</p></div><div class="account-receipt-state"><strong>實收狀態</strong><span class="receipt-status">{{receiptStatus(account)}}</span></div></div><details class="account-extra"><summary>查看付款與完整計算資料</summary><dl><div><dt>應繳日期</dt><dd data-account-due>{{displayCell(account,{key:'dueDate'})}}</dd></div><div><dt>轉帳日期</dt><dd data-account-transfer>{{account.transferDate||'—'}}</dd></div><div><dt>實收金額</dt><dd data-account-receipt>{{amountText(account.receiptTotal)}}</dd></div><div v-if="account.transferLastFive"><dt>轉帳後五碼</dt><dd>{{account.transferLastFive}}</dd></div></dl><p class="reconciliation-detail">{{reconciliationText(account)}}</p><button @click="detailRoom=account.room" :disabled="controlsLocked">查看每月帳務明細 ›</button><p v-if="account.notes">備註：{{account.notes}}</p></details><p v-if="account.creditWarning" class="notice">{{account.creditWarning}}</p></td></tr></tbody></table></div><p v-if="accountsReady&&!displayAccounts.length" class="empty">沒有符合條件的帳務。</p>
</template>
