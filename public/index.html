<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>租務管理</title><meta name="description" content="房客資料、租約、收款與電費管理工作區">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="native-editors.css"><link rel="stylesheet" href="workspace.css">
<script defer src="tenant-vue.global.prod.js"></script><script defer src="access-session.js"></script><script defer src="workspace-transport.js"></script><script defer src="native-tenant.js"></script><script defer src="meter-worksheet.js"></script><script defer src="notice-renderer.js"></script><script defer src="notice-zip.js"></script><script defer src="notice-batch.js"></script><script defer src="payment-worksheet.js"></script><script defer src="native-billing.js"></script><script defer src="report-data.js"></script><script defer src="report-charts.js"></script><script defer src="rental-reports.js"></script><script defer src="workspace.js"></script></head>
<body><section id="access-gate" class="access-gate" role="status"><h1>租務管理</h1><p data-access-message>正在確認登入身分……</p><a href="/auth/login" target="_top" hidden>重新登入</a><button type="button" onclick="location.reload()">重新整理</button></section><p id="workspace-error" role="alert" hidden>畫面發生錯誤，請重新整理並確認剛才的儲存結果。</p><div id="app" v-cloak>
<aside class="sidebar"><a class="brand" href="/" @click.prevent="navigate('overview')"><span class="brand-icon">寓</span><span>租務管理<small>RENTAL WORKSPACE</small></span></a>
<div class="workspace"><span class="dot"></span>私人管理工作區</div><p class="nav-label">管理工作台</p>
<nav aria-label="主要選單"><button v-for="n in nav" :key="n.id" :class="{active:page===n.id}" :aria-current="page===n.id?'page':undefined" @click="navigate(n.id)"><span>{{n.icon}}</span>{{n.label}}</button></nav>
<div class="side-bottom"><div class="demo-mark">GOOGLE · 私人資料</div><p>先把日常整理好，<br>讓管理多一點從容。</p></div></aside>
<div class="main"><header class="workspace-header"><div class="breadcrumb">租務管理 <span>/</span> {{title}}</div><div class="access-identity"><span class="role-tag">{{access.role==='manager'?'管理人':'檢視者'}}</span><span>{{access.email}}</span><a v-if="access.provider==='sites'" :href="access.logoutPath" target="_top">登出</a><form v-else :action="access.logoutPath" method="post"><button type="submit" :disabled="editorBusy">登出</button></form></div></header>
<main class="workspace-main"><div class="intro"><div><p class="eyebrow">RENTAL WORKSPACE</p><h1>{{title}}<span v-if="page==='overview'">，日常一目了然。</span></h1><p class="subtitle">{{subtitles[page]}}</p></div><button v-if="page==='overview'" type="button" class="secondary" @click="loadOverview" :disabled="loading">{{loading?'讀取中……':'重新讀取'}}</button></div>
<p id="access-expired" class="notice" role="alert" hidden></p><p v-if="!access.canWrite" class="viewer-notice">目前為檢視者，可查看資料、照片與報表。</p><p v-if="navigationMessage" class="notice" role="status">{{navigationMessage}}</p>
<template v-if="page==='overview'"><p class="overview-status" role="status">{{status}}</p>
<section class="stats" aria-label="房間資料摘要"><article><span>管理房間</span><div>{{loaded?tenants.length:'—'}}<small>間</small></div><p>依房客資料表的房號整理</p></article>
<article><span>基本租金合計</span><div>{{loaded?money(totalRent):'—'}}<small>元／月</small></div><p>{{missingRent?'尚有 '+missingRent+' 間未填租金':'包含 0 元租金'}}<i>・非本月實收</i></p></article>
<article><span>已填居住者</span><div>{{loaded?withName:'—'}}<small>間</small></div><p>未填姓名不會直接判定空房</p></article>
<article><span>合約資料夾</span><div>{{loaded?withContract:'—'}}<small>間</small></div><p>已附上合約連結的房間</p></article></section>
<div class="section-head"><div><h2>房間概況 <span class="count">{{tenants.length}}</span></h2><p>點選房間，進入同一份房客資料。</p></div><input class="search" v-model="search" placeholder="搜尋房號或居住者" aria-label="搜尋房間"></div>
<section class="room-grid" aria-label="房間概況"><button class="room-card" :class="{'unpaid-room':roomPayment(room.room)?.unpaid>0}" type="button" v-for="room in filteredRooms" :key="room.room" @click="navigate('tenants',room.room)" :aria-label="'查看 '+room.room+' 房'"><div class="room-top"><span class="room-number">{{room.room}}<small>ROOM</small></span><span class="pill" :class="room.name?'green-pill':'neutral-pill'">{{room.name?'已填居住者':'資料待補'}}</span></div><h3>{{room.name||'尚未填寫居住者'}} <span v-if="room.student==='是'" class="student-tag">學生</span></h3><p class="room-sub">{{room.roomType || '房型未設定'}} · 房客與租約資料</p><span v-if="roomPayment(room.room)?.unpaid>0" class="unpaid-label">{{paymentPeriod}} 未收 NT$ {{money(roomPayment(room.room).unpaid)}}</span><div class="room-details"><span>每月租金<strong>{{room.rent===null||room.rent===undefined?'未填寫':'NT$ '+money(room.rent)}}</strong></span><span>租約到期<strong>{{room.endDate||'未填寫'}}</strong></span></div><div class="room-footer">查看／編輯房客資料<span class="arrow">↗</span></div></button></section>
<p v-if="loaded&&!filteredRooms.length" class="empty">沒有符合條件的房間。</p><div class="bottom-note">資料來源：Google 試算表<span>修改請進入房客資料；月租與電費以當月帳務為準。</span></div></template>
<section v-if="page==='tenants'" class="tenant-native" aria-label="房客資料工作區"><tenant-editor :initial-room="selectedRoom" @update-data="acceptTenants" @busy-change="editorBusy=$event"></tenant-editor></section>
<section v-if="page==='accounts'" class="billing-native" aria-label="每月帳務工作區"><billing-editor @busy-change="editorBusy=$event"></billing-editor></section>
<section v-if="page==='reports'" aria-label="收租統計工作區"><rental-reports></rental-reports></section>
</main></div></div></body></html>
